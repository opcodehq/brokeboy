name: Native artifact qualification
on:
  workflow_dispatch:
    inputs:
      musl_only:
        description: Run only the musl jobs
        type: boolean
        default: false
      gnu_only:
        description: Run only the portable GNU jobs
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  platform:
    if: ${{ !inputs.musl_only && !inputs.gnu_only }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            platform: darwin-x64
          - os: macos-15
            platform: darwin-arm64
          - os: windows-latest
            platform: win32-x64-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cargo build --release --locked -p brokeboy-node -p brokeboy-cli
      - run: node scripts/stage-native.mjs --platform ${{ matrix.platform }} --out target/npm/platform
      - run: node test/native.install.cjs target/npm/platform
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: target/npm/platform
  musl:
    if: ${{ !inputs.gnu_only }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64-musl
          - os: ubuntu-24.04-arm
            platform: linux-arm64-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and execute in a matching musl container
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            -e BROKEBOY_NATIVE_PLATFORM=${{ matrix.platform }} \
            -e RUSTFLAGS="-C target-feature=-crt-static" \
            rust:1.94-alpine sh -ec '
              apk add --no-cache nodejs npm build-base linux-headers cmake perl
              cargo build --release --locked -p brokeboy-node -p brokeboy-cli
              node scripts/stage-native.mjs --platform "$BROKEBOY_NATIVE_PLATFORM" --out target/npm/platform
              node test/native.install.cjs target/npm/platform
            '
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: target/npm/platform

  gnu:
    if: ${{ !inputs.musl_only }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64-gnu
            node_arch: x64
            image: quay.io/pypa/manylinux_2_28_x86_64:latest
          - os: ubuntu-24.04-arm
            platform: linux-arm64-gnu
            node_arch: arm64
            image: quay.io/pypa/manylinux_2_28_aarch64:latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and execute against glibc 2.28
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            -e BROKEBOY_NATIVE_PLATFORM=${{ matrix.platform }} \
            -e BROKEBOY_NODE_ARCH=${{ matrix.node_arch }} \
            -e CARGO_HOME=/opt/brokeboy/cargo -e RUSTUP_HOME=/opt/brokeboy/rustup \
            ${{ matrix.image }} bash -euc '
              mkdir -p /opt/brokeboy/node
              curl --fail --location --retry 3 "https://nodejs.org/dist/v24.22.1/node-v24.22.1-linux-${BROKEBOY_NODE_ARCH}.tar.xz" -o /tmp/brokeboy-node.tar.xz
              tar -xJf /tmp/brokeboy-node.tar.xz --strip-components=1 -C /opt/brokeboy/node
              curl --fail --location --retry 3 https://sh.rustup.rs -o /tmp/brokeboy-rustup.sh
              sh /tmp/brokeboy-rustup.sh -y --profile minimal --default-toolchain 1.94.0 --no-modify-path
              export PATH="$CARGO_HOME/bin:/opt/brokeboy/node/bin:$PATH"
              cargo build --release --locked -p brokeboy-node -p brokeboy-cli
              node scripts/stage-native.mjs --platform "$BROKEBOY_NATIVE_PLATFORM" --out target/npm/platform
              node test/native.install.cjs target/npm/platform
            '
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Execute the same prebuilt binaries on the current GNU host
        run: node test/native.install.cjs target/npm/platform
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: target/npm/platform
