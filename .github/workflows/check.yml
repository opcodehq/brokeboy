name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: brokeboy_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-only
          MYSQL_DATABASE: brokeboy_test
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest-only" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TEST_POSTGRES_URL: postgresql://postgres@127.0.0.1:5432/brokeboy_test
      TEST_MYSQL_URL: mysql://root:test-only@127.0.0.1:3306/brokeboy_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test:d1
      - run: bun run benchmark
      - run: npm pack --dry-run
