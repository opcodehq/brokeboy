[workspace]
members = ["crates/brokeboy-core", "crates/brokeboy", "crates/brokeboy-node", "crates/brokeboy-cli"]
resolver = "3"

[workspace.package]
version = "0.2.0-alpha.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/opcodehq/brokeboy"

[workspace.dependencies]
brokeboy-core = { path = "crates/brokeboy-core" }
brokeboy = { path = "crates/brokeboy", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
serde_json_canonicalizer = "0.4.1"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = "symbols"
