[package]
name = "brokeboy"
description = "Embedded asynchronous billing engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
sqlite = ["dep:sqlx", "sqlx/sqlite"]
postgres = ["dep:sqlx", "sqlx/postgres"]
mysql = ["dep:sqlx", "sqlx/mysql"]
stripe = ["dep:reqwest", "dep:hmac", "dep:sha2", "dep:hex"]
polar = ["dep:reqwest", "dep:hmac", "dep:sha2", "dep:base64", "dep:chrono"]
http = ["dep:http"]

[dependencies]
brokeboy-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
sqlx = { workspace = true, optional = true }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }
icu_collator = "~2.3"
url = "2"
http = { version = "1", optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form", "query"], optional = true }
hmac = { version = "0.12", optional = true }
sha2 = { workspace = true, optional = true }
hex = { version = "0.4", optional = true }
base64 = { version = "0.22", optional = true }
chrono = { version = "0.4", default-features = false, features = ["std"], optional = true }

[lints]
workspace = true

[[example]]
name = "embedded"
required-features = ["sqlite"]

[[example]]
name = "streaming"
required-features = ["sqlite"]
